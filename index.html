<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ankang Chen — personal academic homepage.">
  <title>Ankang Chen</title>
  <style>
    :root { color-scheme: light; --ink: #192b38; --muted: #566775; --accent: #176581; --line: #dce4e9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fbfcfc; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; line-height: 1.75; }
    main { width: min(100% - 48px, 760px); margin: 90px auto 64px; }
    header { border-top: 4px solid var(--accent); padding: 35px 0 29px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 10px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.2rem, 6vw, 3rem); font-weight: 500; line-height: 1.2; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .role, .affiliation { margin: 3px 0; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 4px; overflow-wrap: anywhere; }
    a:hover { color: #0d4155; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    section { margin: 33px 0; }
    h2 { margin: 0 0 10px; font-size: 1.15rem; font-weight: 600; }
    p { margin: 8px 0; }
    footer { border-top: 1px solid var(--line); margin-top: 40px; padding-top: 18px; color: var(--muted); font-size: .9rem; }
    @media (max-width: 480px) { main { width: calc(100% - 40px); margin-top: 36px; } header { padding-top: 27px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ankang Chen</h1>
      <p class="role">Master&#39;s Student</p>
      <p class="affiliation">Sun Yat-sen University</p>
    </header>
    <section aria-labelledby="about-heading">
      <h2 id="about-heading">About</h2>
      <p>I am a master&#39;s student at Sun Yat-sen University.</p>
    </section>
    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact</h2>
      <p>Email: <a href="mailto:1743826979@qq.com">1743826979@qq.com</a></p>
      <p>GitHub: <a href="https://github.com/cakerdsp">cakerdsp</a></p>
    </section>
    <footer>Ankang Chen · Personal homepage</footer>
  </main>
</body>
</html>
